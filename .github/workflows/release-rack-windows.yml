name: Release Rack plugin - Windows

# Build on demand, either standalone or as part of Release new version.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional explicit published release tag; requires source_sha'
        type: string
        default: ''
      source_sha:
        description: 'Optional full commit SHA; requires release_tag'
        type: string
        default: ''
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      source_sha:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rack-windows-release
  cancel-in-progress: false

jobs:
  windows:
    name: Build and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: 'msys2 {0}'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || 'main' }}
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make jq zstd git
            mingw-w64-x86_64-gcc mingw-w64-x86_64-clang
            mingw-w64-x86_64-python mingw-w64-x86_64-python-numpy
      - name: Verify explicit release target
        if: inputs.release_tag != '' || inputs.source_sha != ''
        env:
          # Validation invokes the runner's GitHub CLI outside the MSYS2 install.
          MSYS2_PATH_TYPE: inherit
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python scripts/verify_release_target.py "$RELEASE_TAG" "$SOURCE_SHA" --published
      - name: Download and verify Rack SDK
        run: python rack/scripts/sdk.py win-x64
      - name: Checkout test runner from the workflow revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: release-tools
          sparse-checkout: test/rack
          persist-credentials: false
      - name: Check engine and storage
        run: CC=gcc CXX=g++ python release-tools/test/rack/run.py --source-root "$PWD"
      - name: Build plugin and sharing ZIP
        env:
          CORE_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          make -C rack RACK_DIR="$PWD/artifacts/rack-sdk/Rack-SDK" PYTHON=python CC=gcc CXX=g++ -j4 dist
          python rack/scripts/source.py
          python rack/scripts/package-windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: rack-windows-release-${{ github.run_id }}
          overwrite: true
          path: |
            rack/dist/*-win-x64.zip
            rack/dist/*-win-x64-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Upload to selected published release
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: rack-windows-release-${{ github.run_id }}
          path: release-assets
      - name: Upload ZIP and verify published checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_TAG" || -n "$SOURCE_SHA" ]]; then
            python scripts/verify_release_target.py "$RELEASE_TAG" "$SOURCE_SHA" --published
            release_tag="$RELEASE_TAG"
          else
            release_tag="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)"
          fi
          cd release-assets
          sha256sum --check ./*-win-x64-SHA256SUMS.txt
          gh release upload --clobber -- "$release_tag" ./*-win-x64.zip ./*-win-x64-SHA256SUMS.txt
          mkdir verified
          for asset in ./*-win-x64.zip ./*-win-x64-SHA256SUMS.txt; do
            gh release download --dir verified --pattern "$(basename "$asset")" -- "$release_tag"
            cmp "$asset" "verified/$(basename "$asset")"
          done
          (cd verified && sha256sum --check ./*-win-x64-SHA256SUMS.txt)
          release_url="$(gh release view "$release_tag" --json url --jq .url)"
          echo "Published and verified Windows Rack package: $release_url" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain publication diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rack-windows-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets/verified/
          if-no-files-found: warn
          retention-days: 14
