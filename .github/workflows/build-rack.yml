name: Build Rack plugin
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-14, arch: mac-arm64, cc: clang, cxx: clang++}
          - {os: macos-15-intel, arch: mac-x64, cc: clang, cxx: clang++}
          - {os: ubuntu-22.04, arch: lin-x64, cc: gcc, cxx: g++}
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python3 -m pip install numpy
      - name: Install build tools
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew install jq zstd
          else
            sudo apt-get update
            sudo apt-get install -y clang g++ make jq zstd libx11-6 libgl1 libasound2 libjack-jackd2-0 libpulse0
          fi
      - run: python3 rack/scripts/sdk.py ${{ matrix.arch }}
      - name: Root integration and release checks
        run: |
          python3 rack/scripts/manifest.py --check
          python3 -m unittest discover -s test/rack -p 'test_*.py' -v
          python3 -m unittest discover -s test/release -v
      - name: Engine and storage checks
        run: python3 test/rack/run.py --sanitize address,undefined
      - name: Build and integration checks
        run: |
          export RACK_DIR="$PWD/artifacts/rack-sdk/Rack-SDK"
          make clean
          make cleandep
          make dep
          make -j4 dist
          # The headless harness constructs Rack's internal Engine. Clang
          # permits this with a warning; GCC rejects the SDK's PRIVATE marker.
          CXX=clang++ python3 test/rack/module.py --sdk artifacts/rack-sdk/Rack-SDK
          python3 rack/scripts/source.py
          python3 test/rack/source_archive.py --sdk "$RACK_DIR" --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: InfiniteDigits-${{ matrix.arch }}
          path: |
            dist/*.vcvplugin
            rack/dist/*-source.tar.gz
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    defaults:
      run: {shell: 'msys2 {0}'}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make jq zstd git
            mingw-w64-x86_64-gcc mingw-w64-x86_64-clang
            mingw-w64-x86_64-python mingw-w64-x86_64-python-numpy
      - run: python rack/scripts/sdk.py win-x64
      - name: Root integration and version checks
        run: |
          python rack/scripts/manifest.py --check
          python -m unittest discover -s test/rack -p 'test_library.py' -v
          # Native release orchestration tests exercise Unix shells and file
          # URLs. The Unix jobs run those; Windows checks version updates here.
          python -m unittest discover -s test/release -p 'test_release.py' -k VersionTests -v
      - name: Engine, storage, and plugin
        run: |
          CC=gcc CXX=g++ python test/rack/run.py
          export RACK_DIR="$PWD/artifacts/rack-sdk/Rack-SDK" PYTHON=python CC=gcc CXX=g++
          make clean
          make cleandep
          make dep
          # The Windows SDK supplies an import library, not the Rack runtime DLL.
          # Runtime listening/GUI checks require an installed Rack application.
          make -j4 dist
          python rack/scripts/source.py
          python test/rack/source_archive.py --sdk "$RACK_DIR" --arch win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: InfiniteDigits-win-x64
          path: |
            dist/*.vcvplugin
            rack/dist/*-source.tar.gz
          if-no-files-found: error
