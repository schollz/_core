name: Build Firmware

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "v*"
      - "*.*.*"
      - "!zeptocore-visualizer-v*"
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      source_sha:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Verify explicit release target
        if: inputs.release_tag != '' || inputs.source_sha != ''
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 scripts/verify_release_target.py "$RELEASE_TAG" "$SOURCE_SHA"
      - name: Record source commit
        id: source
        run: echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install sox
        run: |
          sudo apt update
          sudo apt install sox libsox-fmt-mp3
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3.0.0
        with:
          hugo-version: "0.135.0"
      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2.2.1
        with:
          version: "0.11.0"
      - name: Setup Go
        uses: actions/setup-go@v5.5.0
      - name: Install Pico SDK dependencies
        run: |
          sudo apt update
          sudo apt install cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential gcc clang wget tar
      - name: Create and activate a Python virtual environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv venv .venv
          echo "VIRTUAL_ENV=.venv" >> $GITHUB_ENV
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
      - name: Install Python dependencies
        run: uv pip install -r requirements.txt
      - run: uv pip freeze
      - name: Checkout pico-sdk
        uses: actions/checkout@v4.2.2
        with:
          repository: raspberrypi/pico-sdk
          path: pico-sdk
          submodules: recursive
          ref: 2.3.1
      - name: Checkout pico-extras
        uses: actions/checkout@v4.2.2
        with:
          repository: raspberrypi/pico-extras
          path: pico-extras
          submodules: recursive
          ref: sdk-2.3.1
      - name: Patch tinyusb
        run: |
          cmake -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk" -P lib/cmake/patch_tinyusb.cmake
      - name: Check SDK upgrade integration
        run: python3 test/sdk_upgrade/run.py
      - name: Set PICO_SDK_PATH
        run: echo "PICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk" >> $GITHUB_ENV
      - name: Prepare artifact filenames
        run: |
          mkdir -p dist
          artifact_ref="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          echo "ARTIFACT_SUFFIX=${artifact_ref//\//-}" >> "$GITHUB_ENV"
      - name: Build zeptocore.uf2
        run: |
          make zeptocore
          cp zeptocore.uf2 "dist/zeptocore_${ARTIFACT_SUFFIX}.uf2"
      - name: Build zeptocore visualizer firmware
        # The zeptocore-visualizer target also flashes hardware; CI only builds.
        run: |
          make zeptocore ZEPTOCORE_VISUALIZER=ON
          cp zeptocore_visualizer.uf2 "dist/zeptocore_${ARTIFACT_SUFFIX}_visualizer.uf2"
      - name: Build zeptocore_256.uf2
        run: |
          make zeptocore_256
          cp zeptocore.uf2 "dist/zeptocore_${ARTIFACT_SUFFIX}_low_latency.uf2"
      - name: Build ezeptocore.uf2
        run: |
          make ezeptocore
          cp ezeptocore.uf2 "dist/ezeptocore_${ARTIFACT_SUFFIX}.uf2"
      - name: Build ezeptocore visualizer firmware
        # The ezeptocore-visualizer target also flashes hardware; CI only builds.
        run: |
          make ezeptocore ZEPTOCORE_VISUALIZER=ON
          cp ezeptocore_visualizer.uf2 "dist/ezeptocore_${ARTIFACT_SUFFIX}_visualizer.uf2"
      - name: Build ezeptocore_256.uf2
        run: |
          make ezeptocore_256
          cp ezeptocore.uf2 "dist/ezeptocore_${ARTIFACT_SUFFIX}_low_latency.uf2"
      - name: Build ezeptocore no overclock
        run: |
          make ezeptocore_noclock
          cp ezeptocore.uf2 "dist/ezeptocore_${ARTIFACT_SUFFIX}_no_overclocking.uf2"
      - name: Build ezeptocore no overclock 256
        run: |
          make ezeptocore_noclock_256
          cp ezeptocore.uf2 "dist/ezeptocore_${ARTIFACT_SUFFIX}_no_overclocking_low_latency.uf2"
      - name: Build ectocore.uf2
        run: |
          make ectocore
          cp ectocore.uf2 "dist/ectocore_${ARTIFACT_SUFFIX}.uf2"
      - name: Build ectocore visualizer firmware
        # The ectocore-visualizer target also flashes hardware; CI only builds.
        run: |
          make ectocore ZEPTOCORE_VISUALIZER=ON
          cp ectocore_visualizer.uf2 "dist/ectocore_${ARTIFACT_SUFFIX}_visualizer.uf2"
      - name: Build ectocore_256.uf2
        run: |
          make ectocore_256
          cp ectocore.uf2 "dist/ectocore_${ARTIFACT_SUFFIX}_low_latency.uf2"
      - name: Build ectocore no overclock
        run: |
          make ectocore_noclock
          cp ectocore.uf2 "dist/ectocore_${ARTIFACT_SUFFIX}_no_overclocking.uf2"
      - name: Build ectocore no overclock 256
        run: |
          make ectocore_noclock_256
          cp ectocore.uf2 "dist/ectocore_${ARTIFACT_SUFFIX}_no_overclocking_low_latency.uf2"
      - name: Build zeptoboard.uf2
        run: |
          make zeptoboard
          cp zeptoboard.uf2 "dist/zeptoboard_${ARTIFACT_SUFFIX}.uf2"
      - name: Check ezeptocore MIDI build
        run: make ezeptocore_midi
      - name: Check filesystem and audio behavior
        run: |
          python3 test/fatfs_seek/run.py
          python3 test/seek_diagnostics/run.py
          python3 test/audio_source/run.py
          python3 test/dsp_loops/run.py
      # Check flag isolation separately from the packaged visualizer firmware.
      - name: Check visualizer build flag (default, ON, OFF)
        run: python3 test/visualizer_build/run.py
      - name: Check MIDI and visualizer telemetry
        run: CC=clang python3 test/midi/run.py
      - name: Prepare source tarball (on tags only)
        if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/')
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          git clone --no-hardlinks --no-checkout "$GITHUB_WORKSPACE" "_core-${ARTIFACT_SUFFIX}"
          git -C "_core-${ARTIFACT_SUFFIX}" checkout --detach "$SOURCE_SHA"
          test "$(git -C "_core-${ARTIFACT_SUFFIX}" rev-parse HEAD)" = "$SOURCE_SHA"
          cd "_core-${ARTIFACT_SUFFIX}/core" && go mod tidy && go mod vendor
          cd ../.. && tar -czvf "dist/_core_${ARTIFACT_SUFFIX}_src.tar.gz" "_core-${ARTIFACT_SUFFIX}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-builds
          overwrite: true
          path: dist/*
          if-no-files-found: ignore

  release:
    name: Create GitHub Release (on tags)
    runs-on: ubuntu-latest
    needs: [build]
    if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware-builds
          path: ./dist

      - name: List artifacts
        run: ls -l ./dist

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ needs.build.outputs.source_sha }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
