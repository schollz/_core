baseURL = 'https://zeptocore.com/'
languageCode = 'en-US'
title = 'Zeptocore'
theme = 'zeptocore'
enableRobotsTXT = true
copyright = 'Copyright 2023–2026 Infinite Digits'

[params]
  brandName = 'Zeptocore'
  seoTitle = 'Zeptocore — Handheld Sample Player & Sequencer'
  description = 'Zeptocore is an open-source, handmade handheld sample player, effects processor, and realtime sequencer by Infinite Digits.'
  socialImage = '/img/zepto3.png'
  socialImageAlt = 'The Zeptocore handheld sample player and sequencer'
  author = 'Infinite Digits'
  organizationURL = 'https://infinitedigits.co/'
  locale = 'en_US'
  keywords = ['handheld sampler', 'sample player', 'music sequencer', 'effects processor', 'open-source instrument', 'portable sampler', 'Zeptocore', 'Infinite Digits']

[sitemap]
  changeFreq = 'weekly'
  priority = 1.0
  filename = 'sitemap.xml'

[outputs]
  home = ['HTML']
  section = ['HTML']
  page = ['HTML']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true


[server]
  [[server.headers]]
    for = '/**'
    [server.headers.values]
      Content-Security-Policy = "default-src * 'unsafe-inline' 'unsafe-eval'; img-src * data: blob:; connect-src *; script-src * 'unsafe-inline' 'unsafe-eval'; style-src * 'unsafe-inline';"
      Referrer-Policy = "no-referrer"
      X-Content-Type-Options = "nosniff"
      X-Frame-Options = "SAMEORIGIN"
      X-XSS-Protection = "0"
