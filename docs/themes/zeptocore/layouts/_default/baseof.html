<!DOCTYPE html>
<html lang="{{ or site.Language.Locale site.Language.Lang }}" dir="{{ or site.Language.Direction `ltr` }}">
<head>
    {{ partial "head.html" . }}
</head>
<body class="migration-page">
    <main class="migration-page__main">
        <a class="migration-page__brand" href="https://infinitedigits.co/">Infinite Digits</a>
        {{ partial "content.html" . }}
    </main>
    <footer class="migration-page__footer">
        <p>© 2023–{{ now.Year }} <a href="https://infinitedigits.co/">Infinite Digits</a></p>
    </footer>
    <script>
        (() => {
            const hash = window.location.hash.slice(1).toLowerCase();
            if (!hash) return;

            const manual = "{{ site.Params.manualURL }}";
            const sections = {
                about: "zeptocore-highlights",
                quickstart: "zeptocore-quickstart",
                modes: "zeptocore-controls",
                combos: "zeptocore-controls",
                "combo-list": "zeptocore-controls",
                effects: "zeptocore-effects",
                "effect-list": "zeptocore-effects",
                "uploading-samples": "zeptocore-samples",
                midi: "zeptocore-midi",
                "uploading-firmware": "zeptocore-firmware",
                "firmware-development": "zeptocore-firmware",
                cases: "zeptocore-extensions",
                zeptoboard: "zeptocore-extensions",
                zeptocade: "zeptocore-extensions",
                questions: "zeptocore-troubleshooting",
                contact: "zeptocore-troubleshooting",
                reference: "zeptocore-controls",
                "is-a-schematic-available": "zeptocore-schematic",
                "how-do-i-change-samples": "zeptocore-control-change-samples",
                "how-do-i-change-volume": "zeptocore-control-volume",
                "how-do-i-start-and-stop": "zeptocore-control-start-stop",
                "change-samples-with-knob": "zeptocore-control-change-samples-knob",
                "midi-with-ittybittymidi": "zeptocore-control-midi-ittybitty",
                "what-is-in-the-battery-holder": "zeptocore-troubleshooting",
                "why-is-it-randomly-shutting-down": "zeptocore-troubleshooting",
                "why-is-the-web-tool-not-showing-waveforms": "zeptocore-troubleshooting",
                "how-does-the-zeptocore-compare": "zeptocore-troubleshooting",
                "sometimes-i-hear-a-weird-glitch": "zeptocore-troubleshooting",
                "how-do-i-know-which-version-i-have": "zeptocore-troubleshooting",
                "why-is-midi-not-working-on-mac-os": "zeptocore-troubleshooting",
                "which-sd-card-can-i-use": "zeptocore-troubleshooting"
            };
            const effects = new Set(["saturation", "loss", "fuzz", "bitcrush", "timestretch", "delay", "comb-filter", "repeat", "tighten", "expand", "circulate", "scratch", "lower", "pitch", "reverse", "tapestop"]);
            const destination = effects.has(hash) ? `zeptocore-effect-${hash}` : (sections[hash] || (hash === "buy" ? "zeptocore-guide" : `zeptocore-control-${hash}`));
            window.location.replace(`${manual.split("#")[0]}#${destination}`);
        })();
    </script>
</body>
</html>
